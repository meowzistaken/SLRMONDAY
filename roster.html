<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelaRNG – Roster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stars" class="stars-canvas"></canvas>

  <div class="page-wrap">
    <header class="roster-header">
      <a href="index.html" class="back-btn">&#8592; Back</a>
      <div class="header-center">
        <h1>SelaRNG</h1>
        <div class="header-date" id="date-display"></div>
      </div>
      <div class="timer-box">
        <div class="timer-label">Next Reveal</div>
        <div class="timer-value" id="countdown">--:--:--</div>
        <div class="timer-sublabel" id="next-label"></div>
      </div>
    </header>

    <div class="mobile-timer-bar">
      <span class="mtb-label">Next Reveal</span>
      <span class="mtb-value" id="countdown-mob">--:--:--</span>
      <span class="mtb-sub" id="next-label-mob"></span>
    </div>

    <main class="single-slot-wrap">
      <div id="slot-container">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div class="loading-label">LOADING ROSTER</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
  // ─────────────────────────────────────────────────────────
  //  Roster page
  // ─────────────────────────────────────────────────────────

  const ITEM_H  = 80;
  const FILLERS = 32;
  const SPIN_MS = 3800;

  initStars('stars');

  const dateStr = getSGTDateStr();
  document.getElementById('date-display').textContent = formatSGTDate();

  // ── Countdown ─────────────────────────────────────────────
  function tickCountdown() {
    const { msUntilNext, nextLabel } = getRevealState();
    const fmt = formatCountdown(msUntilNext);
    document.getElementById('countdown').textContent      = fmt;
    document.getElementById('next-label').textContent     = nextLabel || '';
    document.getElementById('countdown-mob').textContent  = fmt;
    document.getElementById('next-label-mob').textContent = nextLabel || '';
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);

  // ── Helpers ───────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function staticReelHTML(name) {
    return `<div class="reel-track" style="transform:translateY(-${ITEM_H}px)">
      ${['','',name,'',''].map((n,i)=>
        `<div class="reel-item${i===2?' winner':''}">${escHtml(n)}</div>`
      ).join('')}
    </div>`;
  }

  function buildCard(slot, status, roster, animate) {
    const sm   = { UPCOMING:{label:'UPCOMING',cls:'upcoming'}, ACTIVE:{label:'● ACTIVE',cls:'active'}, COMPLETED:{label:'COMPLETED',cls:'completed'} }[status];
    const rh   = slot.revealHour, rm = slot.revealMin || 0;
    const dispH = rh > 12 ? rh - 12 : rh;
    const revealStr = `${dispH}:${String(rm).padStart(2,'0')} ${rh < 12 ? 'AM' : 'PM'}`;

    const reels = ['VAC','PAC','DESK'].map(role => `
      <div class="role-reel">
        <div class="role-label-badge ${role}">${role}</div>
        <div class="reel-window">
          <div class="reel-flash" id="flash-${role}"></div>
          ${animate
            ? `<div class="reel-track" id="track-${role}"></div>`
            : staticReelHTML(roster[role])}
        </div>
      </div>`).join('');

    return `
      <div class="single-slot-card slide-in">
        <div class="slot-header">
          <span class="slot-time">${slot.label}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="status-badge ${sm.cls}">${sm.label}</span>
            <span class="slot-badge">SLOT ${slot.index + 1}</span>
          </div>
        </div>
        <div class="reels-container" style="grid-template-columns:1fr 1fr 1fr">
          ${reels}
        </div>
        <div class="reveal-footnote">Drawn at ${revealStr} SGT · ${dateStr}</div>
      </div>`;
  }

  // ── Slot machine animation ─────────────────────────────────
  function animateReel(track, pool, winner, delayMs) {
    const items = [];
    for (let i = 0; i < FILLERS; i++)
      items.push(pool.length ? pool[Math.floor(Math.random() * pool.length)] : winner);
    items.push(winner);
    items.push(pool[0] || '');
    items.push(pool[1] || '');

    const targetY = -(FILLERS - 1) * ITEM_H;
    track.innerHTML = items.map((n,i) =>
      `<div class="reel-item${i===FILLERS?' winner':''}">${escHtml(n)}</div>`).join('');
    track.style.transition = 'none';
    track.style.transform  = 'translateY(0)';

    const flash = track.parentElement.querySelector('.reel-flash');

    setTimeout(() => {
      if (flash) { flash.classList.add('active'); setTimeout(()=>flash.classList.remove('active'), 200); }
      track.getBoundingClientRect();
      track.style.transition = `transform ${SPIN_MS}ms cubic-bezier(0.02,0.01,0.18,1)`;
      track.style.transform  = `translateY(${targetY}px)`;
      setTimeout(() => {
        track.closest('.single-slot-card')?.classList.add('just-revealed');
        if (flash) { flash.classList.add('active'); setTimeout(()=>flash.classList.remove('active'), 400); }
      }, SPIN_MS);
    }, delayMs);
  }

  // ── Main render ────────────────────────────────────────────
  async function renderCurrentSlot() {
    const container = document.getElementById('slot-container');
    const slot = getCurrentSlot();

    if (!slot) {
      const afterHours = getSGT().getHours() >= 18;
      container.innerHTML = `
        <div class="no-slot-state">
          <div class="no-slot-icon">${afterHours ? '🌙' : '⏳'}</div>
          <div class="no-slot-title">${afterHours ? 'All done for today' : 'No slots yet'}</div>
          <div class="no-slot-sub">${afterHours ? 'Next reveal tomorrow at 6:00 AM SGT' : 'First draw at 6:00 AM SGT'}</div>
        </div>`;
      return;
    }

    // Show spinner while fetching
    container.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><div class="loading-label">LOADING ROSTER</div></div>`;

    try {
      const draw      = await dbGetDraw(dateStr, slot.index);
      const wasStored = !!(draw?.roster);
      const roster    = wasStored ? draw.roster
                                  : await getOrCreateRoster(dateStr, slot.index);
      const status    = getSlotStatus(slot);

      container.innerHTML = buildCard(slot, status, roster, !wasStored);

      if (!wasStored) {
        const users = await dbGetUsers();
        ['VAC','PAC','DESK'].forEach((role, ri) => {
          const track = document.getElementById(`track-${role}`);
          const pool  = users.filter(u => u.roles.includes(role)).map(u => u.name);
          if (track) animateReel(track, pool, roster[role], ri * 450);
        });
      }
    } catch(err) {
      console.error(err);
      container.innerHTML = `
        <div class="no-slot-state">
          <div class="no-slot-icon">⚠️</div>
          <div class="no-slot-title">Connection error</div>
          <div class="no-slot-sub">Could not reach the database. Check your connection.</div>
        </div>`;
    }
  }

  // ── Auto-refresh when slot changes ────────────────────────
  let lastSlotIndex = getCurrentSlot()?.index ?? -1;
  setInterval(async () => {
    const s   = getCurrentSlot();
    const idx = s?.index ?? -1;
    if (idx !== lastSlotIndex) { lastSlotIndex = idx; renderCurrentSlot(); }
  }, 10000);

  // ── Realtime: re-render when admin respins ─────────────────
  dbOnDrawChange(() => renderCurrentSlot());

  // ── Init ──────────────────────────────────────────────────
  renderCurrentSlot();
  </script>
</body>
</html>
